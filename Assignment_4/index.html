<!DOCTYPE html>
<html>

<head>

    <title>Weather Animation</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Weather Animation</h1>

    <div class="buttons">

        <button onclick="sunny()">Sunny</button>

        <button onclick="rainy()">Rainy</button>

        <button onclick="snowy()">Snowy</button>

    </div>

    <div id="sun">☀️</div>

    <div class="cloud cloud1">☁️</div>

    <div class="cloud cloud2">☁️</div>

    <div id="rain">

        <div class="drop d1">💧</div>
        <div class="drop d2">💧</div>
        <div class="drop d3">💧</div>
        <div class="drop d4">💧</div>
        <div class="drop d5">💧</div>
        <div class="drop d6">💧</div>
        <div class="drop d7">💧</div>
        <div class="drop d8">💧</div>

    </div>

    <div id="snow">

        <div class="flake f1">❄</div>
        <div class="flake f2">❄</div>
        <div class="flake f3">❄</div>
        <div class="flake f4">❄</div>
        <div class="flake f5">❄</div>
        <div class="flake f6">❄</div>
        <div class="flake f7">❄</div>
        <div class="flake f8">❄</div>

    </div>

    <script src="script.js"></script>

</body>

</html>
