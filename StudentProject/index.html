<!DOCTYPE html>
<html>

<head>
    <title>Student Portal</title>

    <style>
         
        .box {
            width: 300px;
            margin: 100px;
            padding: 20px;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }
         
    </style>

</head>

<body>

    <h2>Student Marks Calculator</h2>

    <div class="box">

        <label>Student Name</label>
        <input type="text" id="name">

        <label>Physics Marks</label>
        <input type="number" id="Phy">

        <label>Chemistry Marks</label>
        <input type="number" id="Chem">

        <label>Mathematics Marks</label>
        <input type="number" id="Math">

        <button onclick="calculate()">Calculate</button>

        <h3 id="result"></h3>

    </div>

    <script src="script.js"></script>

</body>

</html>
